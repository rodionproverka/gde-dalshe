<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="wingGold" x1="4" y1="8" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bodyTeal" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="doorLight" x1="20" y1="16" x2="28" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Tail feathers: origami swallow fork -->
  <path d="M12 36 L4 44 L16 39 L19 44 L17 35 Z" fill="url(#wingGold)" opacity="0.9"/>
  <!-- Main upper wing in flight -->
  <path d="M17 25 L34 6 L26 21 L44 14 L24 29 Z" fill="url(#wingGold)"/>
  <!-- Body facet with emerald/teal tone -->
  <path d="M16 28 L24 19 L32 25 L23 34 Z" fill="url(#bodyTeal)"/>
  <!-- Beak & head -->
  <path d="M34 23 L44 21 L36 28 Z" fill="url(#wingGold)"/>
  <!-- Open Doorway / Portal in the center of the bird (symbolizing moving to a new life) -->
  <path d="M21 21 L27 18 L27 30 L21 32 Z" fill="#0B131B"/>
  <path d="M23 20 L27 18 L27 30 L23 31 Z" fill="url(#doorLight)" filter="url(#glow)"/>
  <!-- Open door panel swung outward -->
  <path d="M20 22 L23 20 L23 31 L20 32 Z" fill="url(#wingGold)" opacity="0.95"/>
</svg>
